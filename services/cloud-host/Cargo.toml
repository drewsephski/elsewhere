[package]
name = "cloud-host"
version = "0.1.0"
edition = "2021"
description = "Elsewhere cloud agent host (Phase 3B vertical slice)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cloud-host"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
agent-skills = { path = "../../crates/agent-skills" }
codex-provider = { path = "../../crates/codex-provider" }
sprite-computer = { path = "../../crates/sprite-computer" }
openai-responses = { path = "../../crates/openai-responses" }
async-trait = "0.1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
urlencoding = "2"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
saffron = "0.1"
dashmap = "6"
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
flate2 = "1"
tar = "0.4"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
rcgen = { version = "0.14", optional = true }

[features]
test-utils = ["rcgen"]

[[test]]
name = "connectors"
required-features = ["test-utils"]

[[test]]
name = "skills"
required-features = ["test-utils"]

[[test]]
name = "group_auto_routing"
required-features = ["test-utils"]

[[test]]
name = "approval_lifecycle"
required-features = ["test-utils"]

[[test]]
name = "approvals"
required-features = ["test-utils"]

[[test]]
name = "assistant_stream_replay"
required-features = ["test-utils"]

[[test]]
name = "auth_jwt"
required-features = ["test-utils"]

[[test]]
name = "computer_control"
required-features = ["test-utils"]

[[test]]
name = "computer_registry_lifecycle"
required-features = ["test-utils"]

[[test]]
name = "http_api"
required-features = ["test-utils"]

[[test]]
name = "idor"
required-features = ["test-utils"]

[[test]]
name = "local_mac_pairing"
required-features = ["test-utils"]

[[test]]
name = "permission_policies"
required-features = ["test-utils"]

[[test]]
name = "channels"
required-features = ["test-utils"]

[[test]]
name = "memories"
required-features = ["test-utils"]

[[test]]
name = "attachments"
required-features = ["test-utils"]

[[test]]
name = "ask_user"
required-features = ["test-utils"]

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
axum = { version = "0.8", features = ["macros", "ws"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }

[[test]]
name = "github_coding"
required-features = ["test-utils"]

[[test]]
name = "github_coding_trust"
required-features = ["test-utils"]

[[test]]
name = "local_mac_remote"
required-features = ["test-utils"]

[[test]]
name = "local_mac_bot_run_routing"
required-features = ["test-utils"]
