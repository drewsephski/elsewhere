[package]
name = "cloud-host"
version = "0.1.0"
edition = "2021"
description = "Elsewhere cloud agent host (Phase 3B vertical slice)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cloud-host"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../crates/agent-core" }
codex-provider = { path = "../../crates/codex-provider" }
sprite-computer = { path = "../../crates/sprite-computer" }
openai-responses = { path = "../../crates/openai-responses" }
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
saffron = "0.1"
dashmap = "6"
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rcgen = { version = "0.14", optional = true }

[features]
test-utils = ["rcgen"]

[dev-dependencies]
rcgen = "0.14"
axum = { version = "0.8", features = ["macros"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
