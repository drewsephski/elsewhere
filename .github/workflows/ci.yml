name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @elsewhere/www exec next typegen
      - run: pnpm --filter @elsewhere/www lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:www
        env:
          BETTER_AUTH_DATABASE_URL: postgres://build:build@127.0.0.1/build
          BETTER_AUTH_SECRET: ci-build-placeholder-never-used-at-runtime

  cloud-host:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elsewhere
          POSTGRES_PASSWORD: elsewhere
          POSTGRES_DB: elsewhere
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://elsewhere:elsewhere@localhost:5432/elsewhere
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p agent-core
      - run: cargo test -p computer-mcp
      - run: cargo test -p codex-provider
      - run: cargo test -p sprite-computer
      - run: cargo test -p cloud-host --features test-utils

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
