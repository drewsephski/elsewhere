app = "elsewhere-alpha-web"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "infra/fly/Dockerfile.web"
  [build.args]
    NEXT_PUBLIC_BETTER_AUTH_URL = "https://elsewhere-alpha-web.fly.dev"
    NEXT_PUBLIC_ELSEWHERE_CLOUD_HOST_URL = "https://elsewhere-alpha-runner.fly.dev"

[env]
  BETTER_AUTH_URL = "https://elsewhere-alpha-web.fly.dev"
  BETTER_AUTH_DATABASE_SCHEMA = "elsewhere_auth"
  NEXT_PUBLIC_ELSEWHERE_ALPHA_INVITE_REQUIRED = "1"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/auth/ok"

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
