[package]
name = "sprite-computer"
version = "0.1.0"
edition = "2021"
description = "Fly Sprites AgentComputer adapter for Elsewhere"

[dependencies]
agent-core = { path = "../agent-core" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
tokio = { version = "1", features = ["time", "rt", "macros"] }

[dev-dependencies]
agent-core = { path = "../agent-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[[example]]
name = "agent_cloud_proof"
path = "examples/agent_cloud_proof.rs"
