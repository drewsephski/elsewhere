[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
description = "Host-independent Elsewhere agent runtime (Luna / Responses tool loop)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
